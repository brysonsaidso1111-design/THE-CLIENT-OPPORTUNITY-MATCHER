name: Stage 19 Next.js and OpenNext compatibility spike

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "tsconfig.json"
      - ".github/workflows/stage-19-next-opennext-spike.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-19-next-opennext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Pinned dependency install, typecheck, tests, Next and Worker builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: Generate lockfile from exact top-level pins
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean reproducible install from generated lockfile
        run: npm ci
      - name: Typecheck and contract tests
        run: npm run check
      - name: Next.js production build
        run: npm run build
      - name: OpenNext Cloudflare Worker build
        run: npm run build:worker
      - name: Commit generated lockfile to same-repository spike branch
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Committed lockfile already matches the generated lockfile."
          else
            git commit -m "stage-19: commit generated dependency lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload generated lockfile evidence
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stage-19-stack-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
